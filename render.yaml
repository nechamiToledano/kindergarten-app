services:
  - type: web
    name: kga-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @kga/api prisma:generate && pnpm turbo run build --filter=@kga/api...
    startCommand: pnpm --filter @kga/api prisma:deploy && pnpm --filter @kga/api start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        sync: false
      - key: JWT_REFRESH_TTL
        sync: false
      - key: STORAGE_DRIVER
        value: b2
      - key: CDN_BASE_URL
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_PUBLIC_BASE_URL
        sync: false
